name: Deploy to Cloudflare Workers

# Builds the site with OpenNext and deploys the worker on every push to the
# main development branch. Requires two repository secrets:
#   CLOUDFLARE_API_TOKEN   — token with the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  — the account the worker lives in
# and reads one optional repository variable:
#   NEXT_PUBLIC_CF_BEACON_TOKEN — Cloudflare Web Analytics site token
on:
  push:
    branches:
      - claude/vesteri-website-kxnbng
  workflow_dispatch:

# Never let two deploys race; a newer push supersedes one still running.
concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      # Builds Next.js (prebuild regenerates the maps and flags), bundles the
      # OpenNext worker, and deploys it.
      - run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # A NEXT_PUBLIC_* value is inlined into the client bundle at build
          # time, not read at runtime, so it has to be present for this step —
          # setting it on the worker afterwards would do nothing. It is a
          # variable rather than a secret because the token ships in the page
          # source anyway; masking it in the logs would only hide it from us.
          # Unset, the beacon is not rendered and the deploy still succeeds.
          NEXT_PUBLIC_CF_BEACON_TOKEN: ${{ vars.NEXT_PUBLIC_CF_BEACON_TOKEN }}
